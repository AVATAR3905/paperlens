services:
  - type: web
    name: paperlens
    runtime: node
    plan: free
    buildCommand: npm install && cd client && npm install && npm run build && cd ../server && npm install && npm run build
    startCommand: cd server && node dist/index.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: paperlens-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: paperlens-db
    plan: free
    databaseName: paperlens
